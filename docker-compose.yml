# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis
#
# Chạy:
#   docker compose up -d redis      # chỉ Redis
#   docker compose up -d             # agent + redis
#   curl http://localhost:8000/health
#   docker compose logs -f agent
#
# Load balancing (mở rộng của CP4) — dùng file override, KHÔNG dùng
# `docker compose up --scale agent=3` với file này:
#   docker compose -f docker-compose.yml -f docker-compose.lb.yml up -d --scale agent=3
#   curl http://localhost:8080/health
# Lý do: service `agent` ở đây publish cổng 8000 ra host, mà mỗi replica
# chỉ được chiếm một cổng. Scale 3 thì replica thứ 2, 3 báo
# "Bind for 0.0.0.0:8000 failed: port is already allocated".
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    # init: tini làm PID 1 để tín hiệu của Docker tới được uvicorn.
    # Không có nó, `docker compose stop` phải chờ hết timeout rồi SIGKILL.
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # KHÔNG viết secret thẳng vào file này. ${...} để compose đọc từ
      # file .env cùng thư mục — file đó nằm trong .gitignore.
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Trong compose, TÊN SERVICE chính là hostname. `localhost` bên
      # trong container `agent` là chính container `agent`, không phải
      # Redis — đây là lỗi phổ biến nhất lúc mới dùng compose.
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        # service_healthy = đợi Redis thật sự trả lời PING, không chỉ
        # "container đã khởi động". Không có điều kiện này, agent có thể
        # khởi động trước Redis và crash lúc kết nối.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Không có volumes cho agent: service phải STATELESS để scale ngang
    # được. Mọi state (lịch sử hội thoại, rate limit, chi phí) nằm ở
    # Redis, nên container này ghi đè lên kia cũng không mất gì.

volumes:
  redis-data:
