# ═══════════════════════════════════════════════════════════════════
# CP5 — Cấu hình deploy Render.
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub:
#   Dashboard → New → Blueprint → Connect repo → Apply
#
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu vào repo.
# Đó là điểm quan trọng nhất của file này: secret không nằm trong git.
#
# Tham khảo: https://render.com/docs/blueprint-spec
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: day12-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

    # Render dùng endpoint này để quyết định instance đã sẵn sàng chưa
    # và cũng dùng nó cho zero-downtime deploy. /health cố tình KHÔNG
    # phụ thuộc Redis — nếu phụ thuộc thì Redis chết một nhịp là cả
    # service bị coi là hỏng. Việc kiểm tra Redis là của /ready.
    healthCheckPath: /health

    # Render chờ tối đa 30s (mặc định) sau SIGTERM rồi mới SIGKILL.
    # CP4 đã xử lý SIGTERM đúng, nhưng để dư 60s cho instance chậm.
    maxShutdownDelaySeconds: 60

    envVars:
      # Không tạo API key ở đây. Render hỏi bạn lúc Apply Blueprint,
      # giá trị lưu trong dashboard của Render, không nằm trong repo.
      - key: AGENT_API_KEY
        sync: false

      # connectionString = URL qua PRIVATE NETWORK (cùng region):
      #   redis://red-xxxx:6379
      # Không phải URL public — URL đó còn bị chặn bởi ipAllowList.
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: keyvalue
          property: connectionString

      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: LOG_LEVEL
        value: INFO

      # KHÔNG khai báo PORT. Render tự set PORT vào container, Dockerfile
      # đọc ${PORT:-8000} nên dùng cổng Render gán. Ghi đè ở đây sẽ làm
      # Render không tìm thấy app.

  - type: keyvalue
    name: day12-redis
    plan: free
    region: oregon

    # ipAllowList là BẮT BUỘC với Key Value (Render yêu cầu field này).
    # `[]` = chỉ cho phép kết nối từ private network nội bộ Render.
    # Đây là lựa chọn đúng: web service đã lấy connectionString qua
    # private network, không cần mở Redis ra Internet. Mở `0.0.0.0/0`
    # sẽ biến Redis thành mục tiêu để ai đó tấn công từ bên ngoài.
    ipAllowList: []

    # Free instance không hỗ trợ persistence (Render tự đặt là "off"),
    # nên maxmemoryPolicy phải là noeviction: khi đầy thì trả lỗi thay
    # vì xoá âm thầm. Với lab này, xoá lịch sử hội thoại cũ vẫn chấp
    # nhận được — nhưng noeviction cho ta thấy lỗi sớm hơn.
    maxmemoryPolicy: noeviction
